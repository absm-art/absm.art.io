# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# Theme Settings
#
# Review documentation to determine if you should use `theme` or `remote_theme`
# https://mmistakes.github.io/minimal-mistakes/docs/quick-start-guide/#installing-the-theme

# theme                  : "minimal-mistakes-jekyll"
remote_theme             : "mmistakes/minimal-mistakes"
minimal_mistakes_skin    : "sunrise" # "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"

# Site Settings
locale                   : "en-US"
rtl                      : # true, false (default) # turns direction of the page into right to left for RTL languages
title                    : "Blob Base"
title_separator          : "|"
subtitle                 : "Welcome to the BLOB BASE"
name                     : "Andrew Smart"
description              : "I'm an independent multimedia creator from Kansas. I'm interested in contributing to academic, artistic, and activist projects, and I bring a wide range of technical and personal skills to my work. Contact me via email for information on collaborations, commissions, permissions, and general questions or comments. All work featured on this site is original and subject to copyright unless noted. All rights reserved."
url                      : "https://www.absm.art/"
baseurl                  : 
repository               : absm-art/absm.art.io # GitHub username/repo-name e.g. "mmistakes/minimal-mistakes"
teaser                   : /assets/images/IMG_0162.png
logo                     : /assets/images/88x88.PNG
masthead_title           : " " # overrides the website title displayed in the masthead, use " " for no title
breadcrumbs              : true
words_per_minute         : 200
enable_copy_code_button  : # true, false (default)
copyright                : "A.B. Smart"
copyright_url            : # "copyright" URL, defaults to site.url
reCaptcha:
  siteKey                :
  secret                 :
atom_feed:
  path                   : # blank (default) uses feed.xml
  hide                   : # true, false (default)
search                   : true
search_full_content      : # true, false (default)
search_provider          : lunr
lunr:
  search_within_pages    : true
# SEO Related
google_site_verification :
bing_site_verification   :
naver_site_verification  :
yandex_site_verification :
baidu_site_verification  :

# Social Sharing
twitter:
  username               :
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 : # Open Graph/Twitter default site image
# For specifying social profiles
# - https://developers.google.com/structured-data/customize/social-profiles
social:
  type                   : # Person or Organization (defaults to Person)
  name                   : # If the user or organization name differs from the site's name
  links: # An array of links to social media profiles

# Analytics


